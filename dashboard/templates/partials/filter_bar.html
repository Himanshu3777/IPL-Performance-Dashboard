<section class="filter-bar glass-card mb-4">
  <form method="get" action="" class="row g-3 align-items-end">

    <div class="col-md-4">
      <label class="filter-label">
        <i class="fas fa-calendar-alt me-1"></i> Select Season
      </label>
      <select name="season" class="form-select premium-select">
        <option value="All Seasons">All Seasons</option>
        {% for s in seasons %}
          <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-4">
      <label class="filter-label">
        <i class="fas fa-shield-alt me-1"></i> Select Team
      </label>
      <select name="team" class="form-select premium-select">
        {% for t in teams %}
          <option value="{{ t }}">{{ t }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-4 text-end">
      <button type="submit" class="btn btn-premium w-100">
        <i class="fas fa-sync-alt me-2"></i> Update Dashboard
      </button>
    </div>

  </form>
</section>
